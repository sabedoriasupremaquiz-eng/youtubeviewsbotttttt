<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reprodutor do YouTube</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px;
      display: flex; justify-content: center; align-items: flex-start;
      background: #f3f4f6; color: #171717;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(760px, 100%); padding: 24px;
      background: white; border-radius: 14px;
      box-shadow: 0 8px 28px #00000012;
    }
    h1 { margin: 0 0 18px; font-size: 22px; }
    .controls { display: flex; gap: 10px; }
    input {
      flex: 1; min-width: 0; padding: 13px;
      border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px;
    }
    button {
      border: 0; border-radius: 8px; padding: 0 22px;
      background: #dc2626; color: white; font-weight: bold;
      cursor: pointer; font-size: 14px;
    }
    button:hover { background: #b91c1c; }
    #status { min-height: 20px; margin: 12px 0; color: #b91c1c; font-size: 14px; }
    .player { width: 100%; aspect-ratio: 16 / 9; background: #111; border-radius: 10px; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: 0; }
    @media (max-width: 520px) {
      .controls { flex-direction: column; }
      button { padding: 13px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Reprodutor do YouTube</h1>
    <form class="controls" id="form">
      <input id="videoUrl" type="url" placeholder="Cole o link do vídeo do YouTube" required>
      <button type="submit">INICIAR</button>
    </form>
    <p id="status" role="status"></p>
    <div class="player" id="player" hidden></div>
  </main>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('videoUrl');
    const status = document.getElementById('status');
    const player = document.getElementById('player');

    function getVideoId(value) {
      try {
        const url = new URL(value.trim());
        if (url.hostname === 'youtu.be' || url.hostname === 'www.youtu.be') {
          return url.pathname.split('/').filter(Boolean)[0] || null;
        }
        if (['youtube.com', 'www.youtube.com', 'm.youtube.com', 'music.youtube.com'].includes(url.hostname)) {
          if (url.pathname === '/watch') return url.searchParams.get('v');
          const parts = url.pathname.split('/').filter(Boolean);
          if (['embed', 'shorts', 'live'].includes(parts[0])) return parts[1] || null;
        }
      } catch (_) {}
      return null;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const id = getVideoId(input.value);
      if (!id || !/^[a-zA-Z0-9_-]{11}$/.test(id)) {
        status.textContent = 'Link inválido. Cole um link válido de vídeo do YouTube.';
        player.hidden = true;
        player.replaceChildren();
        return;
      }
      status.textContent = '';
      const frame = document.createElement('iframe');
      frame.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id);
      frame.title = 'Vídeo do YouTube';
      frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      frame.allowFullscreen = true;
      player.replaceChildren(frame);
      player.hidden = false;
    });
  </script>
</body>
</html>
