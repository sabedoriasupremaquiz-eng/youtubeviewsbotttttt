<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reprodutor do YouTube</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px;
      display: flex; justify-content: center; align-items: flex-start;
      background: #f3f4f6; color: #171717;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(760px, 100%); padding: 24px;
      background: white; border-radius: 14px;
      box-shadow: 0 8px 28px #00000012;
    }
    h1 { margin: 0 0 18px; font-size: 22px; }
    .controls { display: flex; gap: 10px; }
    input {
      flex: 1; min-width: 0; padding: 13px;
      border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px;
    }
    button {
      border: 0; border-radius: 8px; padding: 0 22px;
      background: #dc2626; color: white; font-weight: bold;
      cursor: pointer; font-size: 14px;
    }
    button:hover { background: #b91c1c; }
    #status { min-height: 20px; margin: 12px 0; color: #b91c1c; font-size: 14px; }
    #player { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .video-item { min-width: 0; padding: 8px; border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; }
    .video-label { margin: 0 0 8px; color: #374151; font-size: 13px; font-weight: bold; }
    .video-thumb { display: block; position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border: 0; border-radius: 7px; padding: 0; background: #111; cursor: pointer; }
    .video-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .video-thumb::after { content: '▶'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; place-items: center; width: 48px; height: 34px; border-radius: 9px; color: white; background: #dc2626; font-size: 19px; }
    .video-item iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 7px; }
    #showAll { display: block; width: 100%; margin: 18px auto 10px; padding: 15px 22px; background: #dc2626; color: #fff; border: 0; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #showAll:hover { background: #b91c1c; }
    #loadMore { display: block; margin: 20px auto 0; padding: 13px 22px; }
    @media (max-width: 520px) { #player { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .video-item { padding: 5px; } }
    @media (max-width: 520px) {
      .controls { flex-direction: column; }
      button { padding: 13px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Reprodutor do YouTube</h1>
    <form class="controls" id="form">
      <input id="videoUrl" type="url" placeholder="Cole o link do vídeo do YouTube" required>
      <button type="submit">INICIAR</button>
    </form>
    <p id="status" role="status"></p>
    <div class="player" id="player" hidden></div>
  </main>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('videoUrl');
    const status = document.getElementById('status');
    const player = document.getElementById('player');

    function getVideoId(value) {
      try {
        const url = new URL(value.trim());
        if (url.hostname === 'youtu.be' || url.hostname === 'www.youtu.be') {
          return url.pathname.split('/').filter(Boolean)[0] || null;
        }
        if (['youtube.com', 'www.youtube.com', 'm.youtube.com', 'music.youtube.com'].includes(url.hostname)) {
          if (url.pathname === '/watch') return url.searchParams.get('v');
          const parts = url.pathname.split('/').filter(Boolean);
          if (['embed', 'shorts', 'live'].includes(parts[0])) return parts[1] || null;
        }
      } catch (_) {}
      return null;
    }

    const BATCH_SIZE = 60;
    let currentVideoId = null;
    let renderedCount = 0;
    let loadMoreButton = null;
    let showAllButton = null;

    function renderNextBatch(targetCount = renderedCount + BATCH_SIZE) {
      if (!currentVideoId) return;

      const fragment = document.createDocumentFragment();
      const end = Math.min(targetCount, 10000);

      for (let i = renderedCount + 1; i <= end; i++) {
        const item = document.createElement('section');
        item.className = 'video-item';

        const label = document.createElement('p');
        label.className = 'video-label';
        label.textContent = 'Vídeo ' + i.toLocaleString('pt-BR') + ' de 10.000';

        const thumbButton = document.createElement('button');
        thumbButton.type = 'button';
        thumbButton.className = 'video-thumb';
        thumbButton.setAttribute('aria-label', 'Reproduzir vídeo ' + i);

        const image = document.createElement('img');
        image.src = 'https://i.ytimg.com/vi/' + encodeURIComponent(currentVideoId) + '/hqdefault.jpg';
        image.alt = 'Miniatura do vídeo ' + i;
        image.loading = 'lazy';
        image.decoding = 'async';

        thumbButton.appendChild(image);
        thumbButton.addEventListener('click', () => {
          if (item.querySelector('iframe')) return;
          const frame = document.createElement('iframe');
          frame.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(currentVideoId);
          frame.title = 'Vídeo do YouTube — exibição ' + i;
          frame.loading = 'lazy';
          frame.referrerPolicy = 'strict-origin-when-cross-origin';
          frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          frame.allowFullscreen = true;
          thumbButton.replaceWith(frame);
        });

        item.append(label, thumbButton);
        fragment.appendChild(item);
      }

      player.appendChild(fragment);
      renderedCount = end;

      if (loadMoreButton) {
        loadMoreButton.hidden = renderedCount >= 10000;
        loadMoreButton.textContent = 'Carregar mais vídeos (' +
          Math.min(BATCH_SIZE, 10000 - renderedCount).toLocaleString('pt-BR') + ')';
      }
      if (showAllButton) {
        showAllButton.hidden = renderedCount >= 10000;
      }
      status.textContent = renderedCount.toLocaleString('pt-BR') +
        ' de 10.000 vídeos exibidos em grade. Clique em uma miniatura para reproduzir.';
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const id = getVideoId(input.value);
      if (!id || !/^[a-zA-Z0-9_-]{11}$/.test(id)) {
        status.textContent = 'Link inválido. Cole um link válido de vídeo do YouTube.';
        player.hidden = true;
        player.replaceChildren();
        if (loadMoreButton) loadMoreButton.remove();
        if (showAllButton) showAllButton.remove();
        return;
      }

      currentVideoId = id;
      renderedCount = 0;
      player.replaceChildren();
      player.hidden = false;
      if (loadMoreButton) loadMoreButton.remove();
      if (showAllButton) showAllButton.remove();

      showAllButton = document.createElement('button');
      showAllButton.id = 'showAll';
      showAllButton.type = 'button';
      showAllButton.textContent = 'MOSTRAR OS 10.000 VÍDEOS';
      showAllButton.addEventListener('click', () => {
        showAllButton.disabled = true;
        showAllButton.textContent = 'CARREGANDO OS 10.000 VÍDEOS...';
        // Build all gallery cards in one batch; thumbnails are lazy-loaded,
        // and actual YouTube players are created only when a thumbnail is clicked.
        requestAnimationFrame(() => {
          renderNextBatch(10000);
          showAllButton.textContent = 'OS 10.000 VÍDEOS ESTÃO NA PÁGINA';
          showAllButton.disabled = true;
        });
      });
      player.before(showAllButton);

      loadMoreButton = document.createElement('button');
      loadMoreButton.id = 'loadMore';
      loadMoreButton.type = 'button';
      loadMoreButton.addEventListener('click', renderNextBatch);
      player.after(loadMoreButton);

      renderNextBatch();
    });
  </script>
</body>
</html>
